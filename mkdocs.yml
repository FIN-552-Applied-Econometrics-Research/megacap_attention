site_name: Lost in Nvidia's Shadow
site_description: Investor attention and mega-cap earnings days (FIN 552, UIUC)
site_url: https://fin-552-applied-econometrics-research.github.io/megacap_attention/
repo_url: https://github.com/FIN-552-Applied-Econometrics-Research/megacap_attention
repo_name: megacap_attention
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - footnotes
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Introduction: introduction.md
  - Methodology: methodology.md
  - Experiments: experiments.md
  - Results: results.md
  - Data guide: data.md
  - Notebooks: notebooks.md
  - References: references.md
